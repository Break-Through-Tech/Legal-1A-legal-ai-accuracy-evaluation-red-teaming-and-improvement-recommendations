[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-citation-detector"
version = "0.1.0"
description = "Detect fabricated legal citations and altered quotes in Alaska family-law drafts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
eval = ["scikit-learn>=1.4"]
dev = ["pytest>=8.0", "scikit-learn>=1.4"]

[project.scripts]
cite-check = "citation_extractor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
